<!DOCTYPE html>
<html>
<head>
<title>Steam Frontend File Generator</title>
<meta charset="UTF-8">
<script src="./Calendar_generator.js"></script>

<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f0f8ff;
    --text: #111111;
    --border: #aaaaaa;
    --border-light: #dddddd;
    --input-bg: #ffffff;
    --box-bg: #ffffff;
    --result-hover: #eef0ff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --bg-secondary: #1e2a35;
      --text: #e8e8e8;
      --border: #444444;
      --border-light: #333333;
      --input-bg: #2a2a2a;
      --box-bg: #242424;
      --result-hover: #2a2a3a;
    }
  }

  body { font-family: Arial; margin: 20px; background: var(--bg); color: var(--text); }
  input[type="text"] { padding: 10px; font-size: 16px; margin: 5px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; }
  button { height: 100%; padding: 10px; font-size: 16px; margin: 5px; cursor: pointer; border-radius: 3px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text);  }
  button:hover { opacity: 0.85; }
  img { height: 500px; }
  input[type="radio"], input[type="checkbox"] { accent-color: #4CAF50; }
  textarea {  padding: 10px; font-size: 16px; margin: 5px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; }
  .container { display: flex; gap: 20px; margin-top: 20px; align-items: center; }
  .box { flex: 1; max-height: 400px; overflow-y: auto; border: 1px solid var(--border); padding: 10px; background: var(--box-bg); border-radius: 4px; }
  .box h3 { margin-top: 0; color: var(--text); }
  .result { padding: 8px; border-bottom: 1px solid var(--border-light); cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
  .result:hover { background: var(--result-hover); }
  .selected-item { padding: 8px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); color: var(--text); }
  .remove-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; }
  .remove-btn:hover { background: #cc0000; }
  .add-btn { background: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; }
  .add-btn:hover { background: #45a049; }
  .controls { margin-top: 15px; }
  .file-type { margin: 10px 0; }
  #status { margin: 10px 0; font-weight: bold; }
  .clear-btn { background: #ff9800; color: white; border: none; }
  .clear-btn:hover { background: #e68900; }
</style>
</head>

<body>
  <h2>Export TSU Schedule for Google Calendar</h2>
  <h4>Go to <a href="https://uni.tsu.ge/schedule" target="_blank">uni.tsu.ge/schedule</a></h4>
  <h4>Press `CTRL-Shift-I` and then this icon:</h4>
  <img src="./Screenshot 2026-10-12 182449.png" alt="instruction 1">
  <h4>Then mouve mouse here and left click:</h4>
  <img src="./Screenshot 2026-10-12 182801.png" alt="instruction 2">
  <h4>Then Copy like this:</h4>
  <img src="./Screenshot 2026-10-12 183124.png" alt="instruction 3">
  <h4>Then paste here:</h4>

  <div class="container">
    <button onclick="loadJSON()">Load Local HTML File</button>
    <h4><b>OR</b></h4>
    <input type="file" id="jsonFile" style="display:none" accept=".html" id="userhtml">
    <textarea rows="10" cols="70" placeholder="Paste the html here" id="userhtml"></textarea>
  </div>

  <button onclick="generateCalendar()" id="genCalendar">
    Generate Calendar
  </button>
  <h4>Next import in <a href="https://calendar.google.com/calendar/u/0/r/settings/export">Google Calendar</a></h4>
  <img src="./Screenshot 2026-10-12 183715.png" alt="instruction 4">
</div>

<script>
  function generateCalendar(){
    const lectures = parseHtml(document.getElementById("userhtml").value);
    const ics = createICS(lectures);
    download("Cxrili.ics", ics);
  }
</script>
</body>
</html>
